name: Deploy to Hostinger (static)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build static site (prerender)
        env:
          # Cambiar a "production" cuando fundacionbubalco.org.ar esté en DNS y listo para indexar.
          VITE_SITE_ENV: preview
        run: npm run build:static

      - name: Check connectivity to Hostinger (HOST:PORT)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time

          host = os.environ.get("HOSTINGER_HOST", "").strip()
          port_raw = os.environ.get("HOSTINGER_PORT", "").strip()
          if not host or not port_raw:
            print("Missing HOSTINGER_HOST or HOSTINGER_PORT")
            sys.exit(1)

          port = int(port_raw)
          retry_delays_seconds = [0, 20, 40, 90, 120]

          try:
            resolved = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
            print(f"DNS OK: {len(resolved)} endpoint(s) for host")
          except socket.gaierror as error:
            print(f"DNS_FAIL: {error}")
            print("Tip: probá usar la IP del servidor en HOSTINGER_HOST (hPanel → SSH Access).")
            sys.exit(1)

          def try_connect() -> bool:
            for family, _, _, _, sockaddr in resolved:
              if family != socket.AF_INET:
                continue
              ip = sockaddr[0]
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(30)
              try:
                sock.connect((ip, port))
                print(f"CONNECT_OK via {ip}:{port}")
                return True
              except OSError as error:
                print(f"CONNECT_FAIL via {ip}:{port} -> {type(error).__name__}: {error}")
              finally:
                sock.close()
            return False

          for attempt, delay in enumerate(retry_delays_seconds, start=1):
            if delay:
              print(f"Waiting {delay}s before retry {attempt}/{len(retry_delays_seconds)}...")
              time.sleep(delay)
            print(f"Attempt {attempt}/{len(retry_delays_seconds)}...")
            if try_connect():
              sys.exit(0)

          print("")
          print("No se pudo abrir TCP al servidor SSH de Hostinger desde GitHub Actions.")
          print("Esto NO es un error de contraseña: el timeout ocurre antes del login.")
          print("")
          print("Checklist:")
          print("- hPanel → Advanced → SSH Access: SSH habilitado")
          print("- HOSTINGER_PORT en shared hosting suele ser 65002 (no 22)")
          print("- HOSTINGER_HOST: IP del servidor (más estable que el hostname)")
          print("- Tras muchos reintentos seguidos, Hostinger puede bloquear IPs temporalmente")
          print("- Esperá 30-60 min y reintentá, o probá: ssh -p PORT user@host desde tu PC")
          sys.exit(1)
          PY

      # Required GitHub Secrets (Settings → Secrets and variables → Actions):
      # - HOSTINGER_HOST        (e.g. "123.123.123.123" or "srv123.hostinger.com")
      # - HOSTINGER_PORT        (usually "22")
      # - HOSTINGER_USERNAME
      # - HOSTINGER_PASSWORD    (or switch to SSH keys; see notes below)
      # - HOSTINGER_TARGET      (absolute path to the site root, typically ".../public_html")
      #
      # Notes:
      # - This workflow uploads dist/** into a temp folder then activates by moving into HOSTINGER_TARGET.
      # - We deploy "htaccess" (no dot) then rename to ".htaccess" on the server to avoid dotfile issues.

      - name: Upload dist/ to Hostinger (temp) via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          timeout: 300s
          source: "dist/**"
          target: "${{ secrets.HOSTINGER_TARGET }}/__deploy_tmp"

      - name: Activate deployment (move build to target root)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          timeout: 300s
          command_timeout: 300s
          script: |
            set -e

            TARGET="${{ secrets.HOSTINGER_TARGET }}"
            TMP="$TARGET/__deploy_tmp"

            # Remove everything in target except the temp folder
            find "$TARGET" -mindepth 1 -maxdepth 1 ! -name "__deploy_tmp" -exec rm -rf {} +

            # Some SCP setups create TMP/dist/...; handle both cases.
            if [ -d "$TMP/dist" ]; then
              SRC="$TMP/dist"
            else
              SRC="$TMP"
            fi

            # Move build artifacts to the target root
            mv "$SRC"/* "$TARGET"/

            # Ensure SPA fallback works on Hostinger: Apache/LiteSpeed reads ".htaccess" (dotfile).
            if [ -f "$TARGET/htaccess" ]; then
              mv "$TARGET/htaccess" "$TARGET/.htaccess"
            fi

            # Cleanup
            rm -rf "$TMP"


